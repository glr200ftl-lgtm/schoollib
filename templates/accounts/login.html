{% extends "base.html" %}
{% block title %}Вход — Школьная библиотека{% endblock %}
{% block content %}
<h1>Вход</h1>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<form method="post" class="auth-form">
    {% csrf_token %}
    {% include "accounts/_form.html" %}
    <button type="submit" class="btn btn-primary">Войти</button>
</form>
<p><a href="{% url 'accounts:password_reset' %}">Забыли пароль?</a> · <a href="{% url 'accounts:register' %}">Регистрация</a></p>
{% endblock %}
